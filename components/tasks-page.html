<section class="tasks-page">

    <!-- Page Heading -->
    <div class="tasks-page-header">

        <div>
            <h1>My Tasks</h1>
            <p>Organize your work and stay on top of your goals.</p>
        </div>

        <button class="add-task-button" id="addTaskButton">
            <span>+</span> Add New Task
        </button>

    </div>


    <!-- Task Summary -->
    <div class="task-summary">

        <div class="summary-card">
            <span>Total Tasks</span>
            <h2 id="pageTotalTasks">0</h2>
        </div>

        <div class="summary-card">
            <span>Active Tasks</span>
            <h2 id="pageActiveTasks">0</h2>
        </div>

        <div class="summary-card">
            <span>Completed</span>
            <h2 id="pageCompletedTasks">0</h2>
        </div>

        <div class="summary-card">
            <span>Overdue</span>
            <h2 id="pageOverdueTasks">0</h2>
        </div>

    </div>


    <!-- Task Filters -->
    <div class="task-filter-panel">

        <div class="task-search">
            <span>⌕</span>
            <input type="search" id="taskSearch" placeholder="Search your tasks...">
        </div>

        <div class="task-filter-controls">

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Study">Study</option>
            </select>

            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
            </select>

            <select id="priorityFilter">
                <option value="all">All Priorities</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

            <select id="sortTasks">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="dueDate">Due Date</option>
                <option value="priority">Priority</option>
            </select>

        </div>

    </div>


    <!-- Task List -->
    <div class="task-list-panel">

        <div class="task-list-heading">

            <div>
                <h2>All Tasks</h2>
                <p>Manage and track your daily activities.</p>
            </div>

            <span id="displayedTaskCount">0 Tasks</span>

        </div>


        <!-- Tasks will be displayed here -->
        <div class="task-list" id="taskList">

            <div class="empty-task-state">

                <div class="empty-task-icon">✓</div>

                <h3>No tasks yet</h3>

                <p>
                    You haven't added any tasks.
                    Start organizing your day by creating your first task.
                </p>

                <button id="emptyAddTaskButton">
                    + Create Your First Task
                </button>

            </div>

        </div>

    </div>

</section>
