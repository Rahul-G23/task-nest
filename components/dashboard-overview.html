<section class="dashboard-overview">

    <!-- Dashboard Heading -->
    <div class="overview-header">

        <div class="overview-title">
            <h1>Dashboard</h1>
            <p>Plan, prioritize, and accomplish your tasks with ease.</p>
        </div>

        <div class="overview-actions">
            <button class="btn-primary" id="addTaskBtn">
                <span>+</span> Add Task
            </button>

            <button class="btn-secondary" id="viewTasksBtn">
                View Tasks
            </button>
        </div>

    </div>

    <!-- Statistics Cards -->
    <div class="stats-grid">

        <div class="stat-card total-card">
            <div class="stat-card-header">
                <h3>Total Tasks</h3>
                <span class="stat-icon">↗</span>
            </div>
            <h2 id="totalTasks">0</h2>
            <p>All your tasks</p>
        </div>

        <div class="stat-card completed-card">
            <div class="stat-card-header">
                <h3>Completed</h3>
                <span class="stat-icon">↗</span>
            </div>
            <h2 id="completedTasks">0</h2>
            <p>Successfully finished</p>
        </div>

        <div class="stat-card active-card">
            <div class="stat-card-header">
                <h3>Active</h3>
                <span class="stat-icon">↗</span>
            </div>
            <h2 id="activeTasks">0</h2>
            <p>Currently in progress</p>
        </div>

        <div class="stat-card overdue-card">
            <div class="stat-card-header">
                <h3>Overdue</h3>
                <span class="stat-icon">↗</span>
            </div>
            <h2 id="overdueTasks">0</h2>
            <p>Needs your attention</p>
        </div>

    </div>

</section>
