<div class="task-modal-overlay" id="taskModalOverlay">

    <div class="task-modal">

        <!-- Modal Header -->
        <div class="task-modal-header">

            <div>
                <h2 id="taskFormHeading">Create New Task</h2>
                <p>Fill in the details to organize your task.</p>
            </div>

            <button type="button" class="modal-close-btn" id="closeTaskModal" aria-label="Close">
                &times;
            </button>

        </div>

        <!-- Task Form -->
        <form id="taskForm">

            <div class="form-group">
                <label for="taskTitle">Task Title <span>*</span></label>
                <input type="text" id="taskTitle" placeholder="Enter task title" maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="taskDescription">Description</label>
                <textarea id="taskDescription" placeholder="Describe your task..." rows="3" maxlength="500"></textarea>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="taskCategory">Category <span>*</span></label>

                    <select id="taskCategory" required>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="taskPriority">Priority <span>*</span></label>

                    <select id="taskPriority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="taskDueDate">Due Date <span>*</span></label>
                    <input type="date" id="taskDueDate" required>
                </div>

                <div class="form-group">
                    <label for="taskDueTime">Due Time</label>
                    <input type="time" id="taskDueTime">
                </div>

            </div>

            <div class="form-group">
                <label for="taskStatus">Task Status</label>

                <select id="taskStatus">
                    <option value="active" selected>Active</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <!-- Form Buttons -->
            <div class="task-form-actions">

                <button type="button" class="cancel-task-btn" id="cancelTaskBtn">
                    Cancel
                </button>

                <button type="submit" class="save-task-btn" id="saveTaskBtn">
                    Create Task
                </button>

            </div>

        </form>

    </div>

</div>
